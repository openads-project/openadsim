services:

  carla-server:
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/simulation/carla/carla-simulator/carla-0.10.0:release_fix-cyclists_3e8a75ab
    environment:
      CARLA_START_TIME: ${CARLA_START_TIME:-}
    command:
      - /bin/bash
      - -ic
      - |
        ./Linux/CarlaUnreal.sh \
          -nosound \
          -RenderOffScreen \
          --ros2 \
          -carla-rpc-port=$${CARLA_PORT} \
          $${CARLA_START_TIME:+-carla-start-time=$${CARLA_START_TIME}}

  carla.carla-converter:
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/simulation/carla/carla_converter:latest_v2x-revision_ci-amd64
    volumes:
      - ./carla-sumo-simulation/carla_converter/params.yml:/docker-ros/ws/install/carla_converter/share/carla_converter/config/params.yml

  carla-spawn-objects:
    environment:
      OBJECTS_DEFINITION_FILE: ${SENSORS:-objects.json}${COSIM_SCENARIO:+,/scenarios/carla-sumo/${COSIM_SCENARIO}/objects.json}
    volumes:
      - ./scenarios/carla-sumo:/scenarios/carla-sumo:ro

  carla-sumo-coordinator:
    environment:
      COSIM_OVERRIDE: "1"
