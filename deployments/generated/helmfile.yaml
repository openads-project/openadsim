environments:
  default:
    values:
      - environments/profiles.yaml.gotmpl
      - environments/services.yaml.gotmpl
      - environments/overrides.yaml.gotmpl
---
releases:
# carla-simulation
- name: '{{ printf "%s-carla-ackermann-control" (env "DEPLOYMENT_PREFIX") | trimPrefix "-" }}'
  chart: oci://ghcr.io/openads-project/carla-ros-bridge/helm/carla-ackermann-control
  version: 0.10.0-1.1.0-carla-ackermann-control-update-deployment
  condition: serviceEnabled.carla-ackermann-control.enabled
  values: [carla-simulation/carla_ackermann_control/values.yaml.gotmpl]
- name: '{{ printf "%s-carla-client" (env "DEPLOYMENT_PREFIX") | trimPrefix "-" }}'
  chart: oci://ghcr.io/openads-project/carla-simulator/helm/carla-client
  version: 0.1.0-helm
  condition: serviceEnabled.carla-client.enabled
  values: [carla-simulation/carla_client/values.yaml.gotmpl]
- name: '{{ printf "%s-carla-control-active-bridge" (env "DEPLOYMENT_PREFIX") | trimPrefix "-" }}'
