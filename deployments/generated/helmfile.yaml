  version: 0.10.0-1.1.0-carla-spawn-objects-update-deployment
  condition: serviceEnabled.carla-spawn-objects.enabled
  values: [carla-simulation/carla_spawn_objects/values.yaml.gotmpl]
- name: '{{ printf "%s-ros-middleware-bridge" (env "DEPLOYMENT_PREFIX") | trimPrefix "-" }}'
