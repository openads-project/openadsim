- name: '{{ printf "%s-carla-scenario-runner-ros-manual-testing" (env "DEPLOYMENT_PREFIX") | trimPrefix "-" }}'
  chart: oci://ghcr.io/openads-project/carla-scenario-runner/helm/carla-scenario-runner-ros
  version: 0.10.0-1.1.0-helm
  condition: serviceEnabled.carla-scenario-runner-ros-manual-testing.enabled
