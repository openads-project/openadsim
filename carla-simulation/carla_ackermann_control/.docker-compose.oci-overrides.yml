# Remote compose file with overrides defined here can be rendered by
# `openadstack/openadstack/utils/scripts/render_compose_sources.py --root-dir carla-simulation`

include:
  - oci://ghcr.io/openads-project/carla-ros-bridge/compose:v0.10.0-1.1.1-carla_ackermann_control

services:

  carla-ackermann-control:
    profiles:
      - carla
    depends_on:
      carla-server:
        condition: service_healthy
    extends:
      file: ../../openadstack/openadstack/utils/compose/docker-compose.template.yml
      service: ros2-service
    environment:
      ACKERMANN_COMMAND_TOPIC: /control/ackermann_trajectory_control/controls
      VEHICLE_CONTROL_COMMAND_TOPIC: /carla/ego_vehicle/vehicle_control_cmd_automated
      PARAMS: /docker-ros/ws/install/carla_ackermann_control/share/carla_ackermann_control/config/params.yml
    volumes:
      - ./params.yml:/docker-ros/ws/install/carla_ackermann_control/share/carla_ackermann_control/config/params.yml
