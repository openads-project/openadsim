# Auto-generated by `../../openadstack/openadstack/utils/scripts/render_compose_sources.py`
# based on `.docker-compose.oci-overrides.yml` with resolved includes
#   include:
#     # https://github.com/openads-project/carla-simulator/blob/v1.0.0-1.0.0-carla-server/deployment/compose/docker-compose.yml
#     - oci://ghcr.io/openads-project/carla-simulator/compose:v1.0.0-1.0.0-carla-server

services:

  carla-server:
    profiles:
      - carla
      - carla-sumo
    depends_on:
      zenoh-router:
        condition: service_healthy
    extends:
      file: ../../openadstack/openadstack/utils/compose/docker-compose.template.yml
      service: gpu-x11-service
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/2000"]
      start_period: 30s
      start_interval: 1s
      interval: 2s
      timeout: 1s
      retries: 3
    # image: ghcr.io/openads-project/carla-simulator:server-slim_v1.0.0-1.0.0
    image: ghcr.io/openads-project/carla-simulator:server_v1.0.0-1.0.0
    environment:
      CARLA_PORT: 2000
      # The native ROS 2 interface runs on Zenoh and needs a Zenoh router (rmw_zenohd).
      # ZENOH_CONFIG_OVERRIDE patches individual keys of the Zenoh session config
      # shipped with CARLA (peer mode, tcp/localhost:7447).
      ZENOH_CONFIG_OVERRIDE: >-
        connect/endpoints=["tcp/zenoh-router:7447"]
      CARLA_START_TIME: ${CARLA_START_TIME:--1}  # Unix time the simulation clock starts at
    # command:
    #   - /bin/bash
    #   - -ic
    #   - |
    #     ./CarlaUnreal.sh \
    #       -nosound \
    #       --ros2 \
    #       --rmw=zenoh \
    #       -carla-rpc-port=$${CARLA_PORT}
    command:
      - /bin/bash
      - -ic
      - |
        ./CarlaUnreal.sh \
          -nosound \
          -quality-level=Medium \
          --ros2 \
          --rmw=zenoh \
          -carla-rpc-port=$${CARLA_PORT} \
          $${CARLA_START_TIME:+-carla-start-time=$${CARLA_START_TIME}} \
          -ENGINEINI=/openadsim/DefaultEngine.ini
    volumes:
      - ./DefaultEngine.ini:/openadsim/DefaultEngine.ini:ro
    expose:
      - "2000"
      - "2001"
      - "2002"

  carla-server-offscreen:
    profiles: !override
      - donotuse
    extends:
      service: carla-server
    # command:
    #   - /bin/bash
    #   - -ic
    #   - |
    #     ./CarlaUnreal.sh \
    #       -nosound \
    #       -RenderOffScreen \
    #       --ros2 \
    #       --rmw=zenoh \
    #       -carla-rpc-port=$${CARLA_PORT}
    command:
      - /bin/bash
      - -ic
      - |
        ./CarlaUnreal.sh \
          -nosound \
          -RenderOffScreen \
          -quality-level=Medium \
          --ros2 \
          --rmw=zenoh \
          -carla-rpc-port=$${CARLA_PORT} \
          $${CARLA_START_TIME:+-carla-start-time=$${CARLA_START_TIME}} \
          -ENGINEINI=/openadsim/DefaultEngine.ini
