services:

  carla-server:
    profiles:
      - carla
    extends:
      file: ../../openadstack/openadstack/utils/compose/docker-compose.template.yml
      service: gpu-x11-service
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/2000"]
      start_period: 30s
      start_interval: 1s
      interval: 2s
      timeout: 1s
      retries: 3
    image: ghcr.io/openads-project/carla-simulator:server-slim_v0.10.0-1.1.1
    environment:
      CARLA_PORT: ${CARLA_PORT:-2000}
    # command:
    #   - /bin/bash
    #   - -ic
    #   - |
    #     ./Linux/CarlaUnreal.sh \
    #       -nosound \
    #       --ros2 \
    #       -carla-rpc-port=$${CARLA_PORT}
    command:
      - /bin/bash
      - -ic
      - |
        ./Linux/CarlaUnreal.sh \
          -nosound \
          -RenderOffScreen \
          --ros2 \
          -carla-rpc-port=$${CARLA_PORT}
    volumes:
      - ./DefaultEngine.ini:/workspace/Linux/CarlaUnreal/Config/DefaultEngine.ini
    expose:
      - "2000"
      - "2001"
      - "2002"
    ipc: service:zenoh-router

  carla-server-offscreen:
    profiles: !override
      - donotuse
    extends:
      service: carla-server
    command:
      - /bin/bash
      - -ic
      - |
        ./Linux/CarlaUnreal.sh \
          -nosound \
          -RenderOffScreen \
          --ros2 \
          -carla-rpc-port=$${CARLA_PORT}
