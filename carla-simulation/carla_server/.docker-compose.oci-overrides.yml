# Remote compose file with overrides defined here can be rendered by
# `openadstack/openadstack/utils/scripts/render_compose_sources.py --root-dir carla-simulation`

include:
  - oci://ghcr.io/openads-project/carla-simulator/compose:v1.0.0-1.0.0-carla-server

services:

  carla-server:
    profiles:
      - carla
      - carla-sumo
    depends_on:
      zenoh-router:
        condition: service_healthy
    extends:
      file: ../../openadstack/openadstack/utils/compose/docker-compose.template.yml
      service: gpu-x11-service
    environment:
      CARLA_START_TIME: ${CARLA_START_TIME:--1}  # Unix time the simulation clock starts at, -1: server start (V2X needs Unix time)
    image: ghcr.io/openads-project/carla-simulator:server_v1.0.0-1.0.0  # full package instead of server-slim: also cooks Town01_Opt-Town07_Opt
    command:
      - /bin/bash
      - -ic
      - |
        ./CarlaUnreal.sh \
          -nosound \
          -quality-level=Medium \
          --ros2 \
          --rmw=zenoh \
          -carla-rpc-port=$${CARLA_PORT} \
          $${CARLA_START_TIME:+-carla-start-time=$${CARLA_START_TIME}} \
          -ENGINEINI=/openadsim/DefaultEngine.ini
    volumes:
      - ./DefaultEngine.ini:/openadsim/DefaultEngine.ini:ro

  carla-server-offscreen:
    profiles: !override
      - donotuse
    # same launch as carla-server, which already renders offscreen
    command:
      - /bin/bash
      - -ic
      - |
        ./CarlaUnreal.sh \
          -nosound \
          -RenderOffScreen \
          -quality-level=Medium \
          --ros2 \
          --rmw=zenoh \
          -carla-rpc-port=$${CARLA_PORT} \
          $${CARLA_START_TIME:+-carla-start-time=$${CARLA_START_TIME}} \
          -ENGINEINI=/openadsim/DefaultEngine.ini
