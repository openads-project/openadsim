# Remote compose file with overrides defined here can be rendered by
# `openadstack/openadstack/utils/scripts/render_compose_sources.py --root-dir carla-simulation`

include:
  - oci://ghcr.io/openads-project/carla-simulator/compose:v0.10.0-1.1.1-carla-server

services:

  carla-server:
    profiles:
      - carla
      - carla-sumo
    extends:
      file: ../../openadstack/openadstack/utils/compose/docker-compose.template.yml
      service: gpu-x11-service
    environment:
      CARLA_START_TIME: ${CARLA_START_TIME:-}
    command:
      - /bin/bash
      - -ic
      - |
        ./Linux/CarlaUnreal.sh \
          -nosound \
          -RenderOffScreen \
          --ros2 \
          -carla-rpc-port=$${CARLA_PORT} \
          $${CARLA_START_TIME:+-carla-start-time=$${CARLA_START_TIME}}
    ipc: service:zenoh-router
    volumes:
      - ./DefaultEngine.ini:/workspace/Linux/CarlaUnreal/Config/DefaultEngine.ini

  carla-server-offscreen:
    profiles: !override
      - donotuse
