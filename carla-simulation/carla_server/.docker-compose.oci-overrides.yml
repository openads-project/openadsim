# Remote compose file with overrides defined here can be rendered by
# `openadstack/openadstack/utils/scripts/render_compose_sources.py --root-dir carla-simulation`

include:
  - oci://ghcr.io/openads-project/carla-simulator/compose:v1.0.0-1.0.0-carla-server

services:

  carla-server:
    profiles:
      - carla
    depends_on:
      zenoh-router:
        condition: service_healthy
    extends:
      file: ../../openadstack/openadstack/utils/compose/docker-compose.template.yml
      service: gpu-x11-service
    command:
      - /bin/bash
      - -ic
      - |
        ./CarlaUnreal.sh \
          -nosound \
          -RenderOffScreen \
          -quality-level=Medium \
          --ros2 \
          --rmw=zenoh \
          -carla-rpc-port=$${CARLA_PORT} \
          -ENGINEINI=/openadsim/DefaultEngine.ini
    volumes:
      - ./DefaultEngine.ini:/openadsim/DefaultEngine.ini:ro

  carla-server-offscreen:
    profiles: !override
      - donotuse
    # same launch as carla-server, which already renders offscreen
    command:
      - /bin/bash
      - -ic
      - |
        ./CarlaUnreal.sh \
          -nosound \
          -RenderOffScreen \
          -quality-level=Medium \
          --ros2 \
          --rmw=zenoh \
          -carla-rpc-port=$${CARLA_PORT} \
          -ENGINEINI=/openadsim/DefaultEngine.ini
