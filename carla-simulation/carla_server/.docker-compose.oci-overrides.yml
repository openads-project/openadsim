# Remote compose file with overrides defined here can be rendered by
# `openadstack/openadstack/utils/scripts/render_compose_sources.py --root-dir carla-simulation`

include:
  # TODO(carla-1.0): include the CARLA 1.0 compose of openads-project/carla-simulator once it is published,
  # then drop the image, environment and command overrides below.
  - oci://ghcr.io/openads-project/carla-simulator/compose:v0.10.0-1.1.1-carla-server

services:

  carla-server:
    profiles:
      - carla
    depends_on:
      zenoh-router:
        condition: service_healthy
    extends:
      file: ../../openadstack/openadstack/utils/compose/docker-compose.template.yml
      service: gpu-x11-service
    image: ghcr.io/openads-project/carla-simulator:server-slim_feature-carla-1.0_ci
    environment:
      # The native ROS 2 interface runs on Zenoh and connects to the Zenoh router.
      ZENOH_CONFIG_OVERRIDE: >-
        connect/endpoints=["tcp/zenoh-router:7447"]
    # CARLA 1.0 cooks its config into the pak; the saved-config layer overrides it.
    command:
      - /bin/bash
      - -ic
      - |
        mkdir -p "$${HOME}/.config/Epic/CarlaUnreal/Saved/Config/Linux"
        cp /openadsim/DefaultEngine.ini "$${HOME}/.config/Epic/CarlaUnreal/Saved/Config/Linux/Engine.ini"
        exec ./CarlaUnreal.sh \
          -nosound \
          -RenderOffScreen \
          --ros2 \
          --rmw=zenoh \
          -carla-rpc-port=$${CARLA_PORT}
    volumes:
      - ./DefaultEngine.ini:/openadsim/DefaultEngine.ini:ro

  carla-server-offscreen:
    profiles: !override
      - donotuse
    command:
      - /bin/bash
      - -ic
      - |
        exec ./CarlaUnreal.sh \
          -nosound \
          -RenderOffScreen \
          --ros2 \
          --rmw=zenoh \
          -carla-rpc-port=$${CARLA_PORT}
