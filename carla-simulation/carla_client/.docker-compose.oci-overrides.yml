# Remote compose file with overrides defined here can be rendered by
# `openadstack/openadstack/utils/scripts/render_compose_sources.py --root-dir carla-simulation`

include:
  - oci://ghcr.io/openads-project/carla-simulator/compose:v1.0.0-1.0.0-carla-client

services:

  carla-client:
    profiles:
      - environment
    depends_on:
      carla-server:
        condition: service_healthy
    extends:
      file: ../../openadstack/openadstack/utils/compose/docker-compose.template.yml
      service: gpu-x11-service
    environment:
      # Traffic level and weather of set_environment.py; MapDefault leaves the weather to another client.
      TRAFFIC: ${TRAFFIC:-}
      WEATHER: ${WEATHER:-}
    command:
      - /bin/bash
      - -ic
      - |
        exec python3 /set_environment.py
    stop_grace_period: 30s
    volumes:
      - ./set_environment.py:/set_environment.py:ro
