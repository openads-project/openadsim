# Remote compose file with overrides defined here can be rendered by
# `openadstack/openadstack/utils/scripts/render_compose_sources.py --root-dir carla-simulation`

include:
  - oci://ghcr.io/openads-project/carla-simulator/compose:v0.10.0-1.1.1-carla-client

services:

  carla-client:
    profiles:
      - traffic
    depends_on:
      carla-server:
        condition: service_healthy
    extends:
      file: ../../openadstack/openadstack/utils/compose/docker-compose.template.yml
      service: gpu-x11-service
    command:
      - /bin/bash
      - -ic
      - |
        exec python3 /set_environment.py
    stop_grace_period: 30s
    volumes:
      - ./set_environment.py:/set_environment.py:ro
