# Remote compose file with overrides defined here can be rendered by
# `openadstack/openadstack/utils/scripts/render_compose_sources.py --root-dir carla-simulation`

include:
  - oci://ghcr.io/openads-project/carla-ros-bridge/compose:v0.10.0-1.1.1-carla_ros_bridge

services:

  carla-ros-bridge:
    profiles:
      - carla
    depends_on:
      carla-server:
        condition: service_healthy
    extends:
      file: ../../openadstack/openadstack/utils/compose/docker-compose.template.yml
      service: ros2-x11-service
    environment:
      HOST: ${CARLA_HOST:-carla-server}
      PORT: ${CARLA_PORT:-2000}
      TOWN: ${MAP:-/opendrive.xodr}
      IGNORE_ALTITUDE: "True"
    volumes:
      - ${CUSTOM_OPENDRIVE:+../../}${CUSTOM_OPENDRIVE:-/dev/null:/dev/null}${CUSTOM_OPENDRIVE:+:/opendrive.xodr}
