        condition: service_healthy
    extends:
      file: ../../openadstack/openadstack/utils/compose/docker-compose.template.yml
      service: ros2-x11-service
    image: ghcr.io/openads-project/carla-ros-bridge:v0.10.0-1.1.1
    environment:
