# Remote compose file with overrides defined here can be rendered by
# `openadstack/openadstack/utils/scripts/render_compose_sources.py --root-dir carla-simulation`

include:
  - oci://ghcr.io/openads-project/carla_converter/compose:v1.3.2

services:

  carla-converter:
    profiles:
      - carla
    depends_on:
      carla-server:
        condition: service_healthy
    extends:
      file: ../../openadstack/openadstack/utils/compose/docker-compose.template.yml
      service: ros2-service
    environment:
      NAMESPACE: /carla
    volumes:
      - ./params.yml:/docker-ros/ws/install/carla_converter/share/carla_converter/config/params.yml
