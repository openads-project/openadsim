services:

  carla-server:
    extends:
      file: ../openadstack/openadstack/utils/compose/docker-compose.template.yml
      service: gpu-x11-service
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/2000"]
      start_period: 30s
      start_interval: 1s
      interval: 2s
      timeout: 1s
      retries: 3
    image: ghcr.io/openads-project/carla-simulator:server-slim_v0.10.0-1.1.0
    command: bash -ic './Linux/CarlaUnreal.sh -nosound --ros2'
    expose:
      - "2000"
      - "2001"
      - "2002"
    ipc: service:zenoh-router

  carla-server-offscreen:
    extends:
      service: carla-server
    command: bash -ic './Linux/CarlaUnreal.sh -nosound -RenderOffScreen --ros2'
    ipc: service:zenoh-router

  carla-client:
    depends_on:
      carla-server:
        condition: service_healthy
    extends:
      file: ../openadstack/openadstack/utils/compose/docker-compose.template.yml
      service: gpu-x11-service
    image: ghcr.io/openads-project/carla-simulator:client_v0.10.0-1.1.0
    command: sleep infinity

  carla-spawn-objects:
    depends_on:
      carla-server:
        condition: service_healthy
    extends:
      file: ../openadstack/openadstack/utils/compose/docker-compose.template.yml
      service: ros2-service
    image: ghcr.io/openads-project/carla-ros-bridge:v0.10.0-1.1.0
    environment:
      # --- name ------
      NAMESPACE: /
      NAME: carla_spawn_objects
      # --- other -----
      LOG_LEVEL: ${LOG_LEVEL:-info}
      USE_SIM_TIME: ${USE_SIM_TIME:-false}
      OBJECTS_DEFINITION_FILE: ${OBJECTS_DEFINITION_FILE:-objects.json}
      OBJECTS_DIRECTORY: ${OBJECTS_DIRECTORY:-/docker-ros/ws/install/carla_spawn_objects/share/carla_spawn_objects/config}
      BLUEPRINTS_DIRECTORY: ${BLUEPRINTS_DIRECTORY:-/docker-ros/ws/install/carla_spawn_objects/share/carla_spawn_objects/config/blueprints}
      ROLE_NAME: ${ROLE_NAME:-ego_vehicle}
      SPAWN_POINT_EGO_VEHICLE: ${SPAWN_POINT_EGO_VEHICLE:-None}
      SPAWN_SENSORS_ONLY: ${SPAWN_SENSORS_ONLY:-False}
      CONTROL_ID: ${CONTROL_ID:-control}
    command:
      - /bin/bash
      - -ic
      - |
        ros2 launch carla_spawn_objects carla_example_ego_vehicle.launch.py \
          objects_definition_file:=$${OBJECTS_DEFINITION_FILE} \
          objects_directory:=$${OBJECTS_DIRECTORY} \
          blueprints_directory:=$${BLUEPRINTS_DIRECTORY} \
          role_name:=$${ROLE_NAME} \
          spawn_point_ego_vehicle:=$${SPAWN_POINT_EGO_VEHICLE} \
          spawn_sensors_only:=$${SPAWN_SENSORS_ONLY} \
          control_id:=$${CONTROL_ID}

