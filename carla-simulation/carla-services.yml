      IGNORE_TILT: ${IGNORE_TILT:-True}
      GEOREFERENCE_SUBSTITUTION: ${GEOREFERENCE_SUBSTITUTION:-}
      GRID_CONVERGENCE: ${GRID_CONVERGENCE:-None}
      PUBLISH_ETSI_MESSAGES: ${PUBLISH_ETSI_MESSAGES:-False}
      MAPEM_TIMER_PERIOD: ${MAPEM_TIMER_PERIOD:-1.0}
      SPATEM_TIMER_PERIOD: ${SPATEM_TIMER_PERIOD:-0.1}
      INTEGRATE_ALL_JUNCTIONS: ${INTEGRATE_ALL_JUNCTIONS:-False}
