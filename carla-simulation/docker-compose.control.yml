services:

  carla-ackermann-control:
    profiles:
      - carla
    extends:
      file: ./carla-services.yml
      service: carla-ackermann-control
    environment:
      PARAMS: /docker-ros/ws/install/carla_ackermann_control/share/carla_ackermann_control/config/params.yml
      ACKERMANN_COMMAND_TOPIC: /control/ackermann_trajectory_control/controls
      VEHICLE_CONTROL_COMMAND_TOPIC: /carla/ego_vehicle/vehicle_control_cmd_automated
    image: ghcr.io/openads-project/carla-ros-bridge:latest_update-deployment_ci # TODO remove
    volumes:
      - ./config/carla_ackermann_control/params.yml:/docker-ros/ws/install/carla_ackermann_control/share/carla_ackermann_control/config/params.yml

  carla-manual-control:
    profiles:
      - carla
    extends:
      file: ./carla-services.yml
      service: carla-manual-control
    privileged: true

  carla-control-active-bridge:
    profiles:
      - carla
    depends_on:
      - carla-manual-control
    restart: unless-stopped # requires incoming topic
    extends:
      file: ../openadstack/openadstack/utils/compose/docker-compose.template.yml
      service: ros2-service
    image: ghcr.io/openads-project/monitoring:v26.9.4
    command: >
      ros2 run topic_tools transform
        /carla/ego_vehicle/vehicle_control_manual_override
        /control/active
        std_msgs/Bool
        "std_msgs.msg.Bool(data=not m.data)"
        --import std_msgs
