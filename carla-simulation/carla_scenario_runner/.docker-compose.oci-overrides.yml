# Remote compose file with overrides defined here can be rendered by
# `openadstack/openadstack/utils/scripts/render_compose_sources.py --root-dir carla-simulation`

include:
  - oci://ghcr.io/openads-project/carla-scenario-runner/compose:helm # TODO

services:

  carla-scenario-runner-ros:
    profiles:
      - donotuse
    depends_on:
      carla-server:
        condition: service_healthy
    extends:
      file: ../../openadstack/openadstack/utils/compose/docker-compose.template.yml
      service: ros2-x11-service

  carla-scenario-runner-ros-template:
    profiles:
      - donotuse
    extends:
      service: carla-scenario-runner-ros
    environment:
      MAP: ${MAP:-}
      CUSTOM_OPENDRIVE: ${CUSTOM_OPENDRIVE:-}
      CUSTOM_LANELET: ${CUSTOM_LANELET:-}
    volumes:
      - ../../utils/scenario-checker/scenario_checker.py:/scenario_checker.py:ro
      - ../../scenarios:/scenarios

  carla-scenario-runner-ros-manual-testing:
    profiles:
      - manual-testing
    extends:
      service: carla-scenario-runner-ros-template
    environment:
      SCENARIO_MAP: ${CUSTOM_OPENDRIVE:-${MAP:-}}
    command:
      - /bin/bash
      - -ic
      - |
        set -e
        python3 /scenario_checker.py validate-runtime /scenarios
        SCENARIOS_DIR=/scenarios
        if [ -n "$${CUSTOM_OPENDRIVE}" ]; then
          SCENARIOS_DIR="$$(dirname "/$${CUSTOM_OPENDRIVE#/}")"
        fi
        exec ros2 launch carla_ros_scenario_runner carla_ros_scenario_runner_with_selection.launch.py \
          scenario_runner_path:=$${SCENARIO_RUNNER_PATH} \
          scenarios_dir:=$${SCENARIOS_DIR}

  carla-scenario-runner-ros-automated-testing:
    profiles:
      - automated-testing
    extends:
      service: carla-scenario-runner-ros-template
    depends_on:
      - carla-ros-bridge
    environment:
      SCENARIO_FILE: ${SCENARIO_FILE}
    command:
      - /bin/bash
      - -ic
      - |
        set -e
        python3 /scenario_checker.py validate-runtime "/$${SCENARIO_FILE}"
        exec python3 -u "$${SCENARIO_RUNNER_PATH}/scenario_runner.py" \
          --host "$${CARLA_HOST}" \
          --openscenario /$${SCENARIO_FILE} \
          --output \
          --rtFactor 1.0 \
          --waitForEgo
