# Auto-generated by `../../openadstack/openadstack/utils/scripts/render_compose_sources.py`
# based on `.docker-compose.oci-overrides.yml` with resolved includes
#   include:
#     # https://github.com/openads-project/carla-scenario-runner/blob/v0.10.0-1.1.1/deployment/compose/docker-compose.yml
#     - oci://ghcr.io/openads-project/carla-scenario-runner/compose:v0.10.0-1.1.1

services:

  carla-scenario-runner-ros:
    profiles:
      - donotuse
    depends_on:
      carla-server:
        condition: service_healthy
    extends:
      file: ../../openadstack/openadstack/utils/compose/docker-compose.template.yml
      service: ros2-x11-service
    image: ghcr.io/openads-project/carla-scenario-runner/ros:v0.10.0-1.1.1
    environment:
      USE_SIM_TIME: ${USE_SIM_TIME:-true}
      # CARLA_HOST: carla-server
      CARLA_HOST: ${CARLA_HOST:-carla-server}
      # CARLA_PORT: 2000
      CARLA_PORT: ${CARLA_PORT:-2000}
      ROLE_NAME: ego_vehicle
      SCENARIO_RUNNER_PATH: /docker-ros/additional-files
      WAIT_FOR_EGO: true
      SCENARIOS_DIR: /scenarios
      MAP: ${MAP:-}
      CUSTOM_OPENDRIVE: ${CUSTOM_OPENDRIVE:-}
      CUSTOM_LANELET: ${CUSTOM_LANELET:-}
    command:
      - /bin/bash
      - -ic
      - |
        ros2 launch carla_ros_scenario_runner carla_ros_scenario_runner_with_selection.launch.py \
          use_sim_time:=$${USE_SIM_TIME} \
          host:=$${CARLA_HOST} \
          port:=$${CARLA_PORT} \
          role_name:=$${ROLE_NAME} \
          scenario_runner_path:=$${SCENARIO_RUNNER_PATH} \
          wait_for_ego:=$${WAIT_FOR_EGO} \
          scenarios_dir:=$${SCENARIOS_DIR}
    volumes:
      - ../../utils/scenario-checker/scenario_checker.py:/scenario_checker.py:ro
      - ../../scenarios:/scenarios

  carla-scenario-runner-ros-manual-testing:
    profiles:
      - manual-testing
    extends:
      service: carla-scenario-runner-ros
    environment:
      SCENARIO_MAP: ${CUSTOM_OPENDRIVE:-${MAP:-}}
    command:
      - /bin/bash
      - -ic
      - |
        set -e
        python3 /scenario_checker.py validate-runtime /scenarios
        SCENARIOS_DIR=/scenarios
        if [ -n "$${CUSTOM_OPENDRIVE}" ]; then
          SCENARIOS_DIR="$$(dirname "/$${CUSTOM_OPENDRIVE#/}")"
        fi
        exec ros2 launch carla_ros_scenario_runner carla_ros_scenario_runner_with_selection.launch.py \
          use_sim_time:=${USE_SIM_TIME} \
          host:=${CARLA_HOST} \
          port:=${CARLA_PORT} \
          role_name:=${ROLE_NAME} \
          scenario_runner_path:=${SCENARIO_RUNNER_PATH} \
          wait_for_ego:=${WAIT_FOR_EGO} \
          scenarios_dir:=${SCENARIOS_DIR}

  carla-scenario-runner-ros-automated-testing:
    profiles:
      - automated-testing
    depends_on:
      - carla-ros-bridge
    extends:
      service: carla-scenario-runner-ros
    environment:
      SCENARIO_FILE: ${SCENARIO_FILE}
    command:
      - /bin/bash
      - -ic
      - |
        set -e
        python3 /scenario_checker.py validate-runtime "/$${SCENARIO_FILE}"
        exec python3 -u "$${SCENARIO_RUNNER_PATH}/scenario_runner.py" \
          --host "$${CARLA_HOST}" \
          --openscenario /$${SCENARIO_FILE} \
          --output \
          --rtFactor 1.0 \
          --waitForEgo
