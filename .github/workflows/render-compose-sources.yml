name: Render compose sources

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  render-compose-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install -r openadstack/openadstack/utils/scripts/requirements.txt
      - name: Render compose sources
        run: |
          python openadstack/openadstack/utils/scripts/render_compose_sources.py --root-dir carla-simulation
          python openadstack/openadstack/utils/scripts/render_compose_sources.py --root-dir sumo-simulation
      - name: Check generated files
        run: |
          if [[ ! -z "$(git status --porcelain)" ]]; then
            echo "::error::render_compose_sources.py changed files. Render the CARLA and SUMO sources locally and commit the result."
            git diff
            exit 1
          fi
