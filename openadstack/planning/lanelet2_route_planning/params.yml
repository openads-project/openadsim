/**/*:
  ros__parameters:

    ll2_map_server_name: /localization/lanelet2_map_server
    publish_frequency: 20.0
    action_feedback_frequency: 1.0
    sampling_distance: 1.0
    publish_frequency_global: 1.0
    sampling_max_lateral_error_global: 0.5
    project_destination_to_reference_line: true
    destination_distance_threshold: 1.0
    required_traveled_distance_proportion: 0.5
    enrich_route_ahead_ego_distance: 300.0
    enrich_route_behind_ego_distance: 20.0
    route_undershoot_distance: 10.0
    route_overshoot_distance: 10.0
    max_drivable_space_radius: 50.0
    max_num_threads: 8
    transform_timeout: 0.1

    diagnostic_updater:
      period: 0.1
      use_fqn: true
      # ego_data_diagnostic:
      #   min_frequency: 45.45 # 0.022s
      #   max_frequency: 55.55 # 0.018s
      #   min_acceptable_timestamp_delta: 0.0
      #   max_acceptable_timestamp_delta: 0.002
      # route_timer_diagnostic:
      #   min_frequency: 18.18 # 0.055s
      #   max_frequency: 22.22 # 0.045s
      # global_route_timer_diagnostic:
      #   min_frequency: 0.91 # 1.1s
      #   max_frequency: 1.11 # 0.9s

    # --- plan_route_action_client ---
    waypoints:
      - "50.787524, 6.050095, -1"
      - "50.779794, 6.050634, -1"
      - "50.784935, 6.043669, -1"
      - "50.787801, 6.046555"
    enable_random_destination: false
    enable_continuous_planning: true
    continuous_planning_replanning_proportion: 0.6
    cancel_route: false